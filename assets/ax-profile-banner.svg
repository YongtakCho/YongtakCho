    <text x="60" y="142" fill="#f4f6f3" font-size="66" font-weight="700">조용탁</text>
    <text x="284" y="139" fill="#c4d4dc" font-size="32" font-weight="300">Yongtak Cho</text>
    <text x="64" y="196" fill="#f4f6f3" font-size="25" font-weight="600">AX 전문가 · 공공 AX 실행 전략가 · 저자</text>
    <text x="64" y="244" fill="#b9cbd5" font-size="21">현장의 문제를 AI로 풀고, 조직이 일하는 방식을 바꿉니다.</text>
